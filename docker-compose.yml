# Desenvolvimento/staging: PHP-FPM + Nginx + MySQL + Redis + worker + scheduler.
# Uso: cp .env.example .env  &&  docker compose up -d --build
# Os valores abaixo (senhas) são APENAS para desenvolvimento local.
services:
  app:
    build: { context: ., target: app }
    env_file: .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: votaflow
      DB_USERNAME: votaflow
      DB_PASSWORD: dev-only
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes: ['.:/var/www/html']
    depends_on: [mysql, redis]

  nginx:
    image: nginx:1.27-alpine
    ports: ['8000:80']
    volumes: ['.:/var/www/html:ro', './docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro']
    depends_on: [app]

  queue:
    build: { context: ., target: app }
    command: php artisan queue:work --queue=broadcasts,default --tries=3 --max-time=3600
    env_file: .env
    environment: &env
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: votaflow
      DB_USERNAME: votaflow
      DB_PASSWORD: dev-only
      REDIS_HOST: redis
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes: ['.:/var/www/html']
    depends_on: [mysql, redis]

  scheduler:
    build: { context: ., target: app }
    command: php artisan schedule:work
    env_file: .env
    environment: *env
    volumes: ['.:/var/www/html']
    depends_on: [mysql, redis]

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: votaflow
      MYSQL_USER: votaflow
      MYSQL_PASSWORD: dev-only
      MYSQL_ROOT_PASSWORD: dev-only-root
    volumes: ['mysql-data:/var/lib/mysql']
    command: ['--innodb-flush-log-at-trx-commit=1', '--max-connections=500']

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'no']

volumes:
  mysql-data:
